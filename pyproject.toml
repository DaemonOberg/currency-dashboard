[project]
name = "currency-dashboard"
version = "0.1.0"
description = "SEK Currency Dashboard built with Flask, Pandas, and Plotly"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "requests==2.34.2",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "djlint==1.47.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.djlint]
profile = "jinja"
indent = 4

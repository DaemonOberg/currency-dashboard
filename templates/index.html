{% extends "base.html" %}
{% block content %}
<h1>Welcome to Currency Dashboard</h1>
<h2>Select currencies to compare against SEK</h2>
<form method="get" action="/results">
    <input type="checkbox" value="EUR" name="currencies" id="eur">
    <label for="eur">EUR</label>

    <input type="checkbox" value="USD" name="currencies" id="usd">
    <label for="usd">USD</label>

    <input type="checkbox" value="GBP" name="currencies" id="gbp">
    <label for="gbp">GBP</label>

    <input type="checkbox" value="NOK" name="currencies" id="nok">
    <label for="nok">NOK</label>

    <input type="checkbox" value="JPY" name="currencies" id="jpy">
    <label for="jpy">JPY</label>

    <button type="submit">Submit</button>
</form>
{% endblock %}
